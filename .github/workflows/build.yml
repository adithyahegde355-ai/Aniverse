name: Build AniVerse Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project files
        run: |
          if [ ! -f package.json ]; then
            echo "ERROR: package.json is missing."
            exit 1
          fi

          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        run: npm run build

      - name: Create Capacitor configuration
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aniverse.app",
            "appName": "AniVerse",
            "webDir": "dist"
          }
          EOF
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release-apk/AniVerse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniVerse-APK
          path: release-apk/AniVerse.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aniverse-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: AniVerse Android Build ${{ github.run_number }}
          body: |
            AniVerse Android APK.

            Download AniVerse.apk from the Assets section.
            This is a debug APK intended for testing and manual installation.
          files: release-apk/AniVerse.apk
          make_latest: true
